modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
[[mods]]
modId="enigmaticcurio"
version="${mod_version}"
displayName="神秘遗物系饰品增强"
description='''
只修改神秘遗物 / 神秘遗物扩展 / 神秘佳肴的现有饰品,不新增任何物品。

- 磁吸戒指 / 超级磁吸戒指:吸取范围改为 36 格
- 复苏之叶:Ctrl + 左键 开关它授予的创造飞行
- 血战沙场之证:假血条锁血(默认 1 点,受伤只扣它、回血无效),潜行 + 右键 切换
- 书籍:Ctrl + 右键 锁定,锁定后右键不打开
- 冒险者之证 / 绝望者证章:可正常挖掘方块;手持冒险者之证死亡转化为绝望者证章
- 失落引擎:拦截惩罚雷击
- 锻造者的宝石:铁砧上两本同级同附魔书直接升满级
- 无知诅咒卷轴:单次经验加上限,防溢出
- 无止暴食之证:饱食度锁 0、饱和度锁 1
- 末影之戒 / 末影箱:容量扩到 54 格(9x6)
- 救赎之戒:不破损、隐藏背叛条、可与七咒之戒同戴
- 七咒之戒:古旧书袋收齐「倒转之启 / 无止之言 / 恩惠之典」时修正第四重咒
- 万钧之护卷轴:雷击可开关,攻击伤害加成可配置
- 附魔师的珍珠:兼容神化附魔台;佩戴时神化重铸台不消耗新生符石
'''
[[dependencies.enigmaticcurio]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"
